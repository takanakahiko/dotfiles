# グローバルに使うランタイムと CLI ツール（`mise install` で揃う）
# java は temurin@8 cask の system Java を使うので mise では管理しない

[tools]
# --- ランタイム ---
node = "26.12.1"
python = "3.13.3t"
bun = "1.3.12"
go = "1.27.4"

# --- Node 製 CLI ---
pnpm = "12.14.0"
"npm:@devcontainers/cli" = "0.89.0"
"npm:@openai/codex" = "0.165.0"
"npm:@vivliostyle/cli" = "11.3.3"
"npm:agent-browser" = "0.39.1"

# --- Python 製 CLI ---
"pipx:pre-commit" = "4.2.0"

# --- Go 製 CLI（旧 Brewfile の go 行）---
"go:github.com/air-verse/air" = "latest"
"go:golang.org/x/tools/cmd/deadcode" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:github.com/onsi/ginkgo/v2/ginkgo" = "latest"
"go:golang.org/dl/go1.24.3" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:github.com/fatih/gomodifytags" = "latest"
"go:github.com/haya14busa/goplay/cmd/goplay" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/cweill/gotests/gotests" = "latest"
"go:github.com/josharian/impl" = "latest"
"go:github.com/golang-migrate/migrate/v4/cmd/migrate" = "latest"
"go:go.uber.org/mock/mockgen" = "latest"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "latest"
"go:github.com/ogen-go/ogen/cmd/ogen" = "latest"
"go:go.abhg.dev/requiredfield/cmd/requiredfield" = "latest"
"go:github.com/a-h/generate/cmd/schema-generate" = "latest"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
